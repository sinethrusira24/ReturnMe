<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusLocator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="nav-logo" style="justify-content: center; margin-bottom: 1rem;">
                    <i class="fa-solid fa-building-columns"></i> CampusLocator
                </a>
                <h2>Welcome Back</h2>
                <p>Log in using your official campus email</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email"><i class="fa-regular fa-envelope"></i> Campus Email</label>
                    <input type="email" id="email" class="form-control" placeholder="e.g., student@campus.edu" required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <div class="auth-options">
                    <label class="remember-me"><input type="checkbox"> Remember me</label>
                    <a href="#" class="forgot-link" onclick="triggerAlert('Password reset link sent to your email.', 'info')">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary btn-block" style="margin-top: 1.5rem;">Log In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </div>
        </div>
    </div>
    <div id="toast-container"></div>
    <script src="script.js"></script>
</body>
</html>
