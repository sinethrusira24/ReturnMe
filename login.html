<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ReturnMe secure login for university lost and found accounts.">
    <title>Log In | ReturnMe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">

    <div class="page-top-header">
        <div class="top-logo"><i class="fa-solid fa-building-columns"></i></div>
        <p class="top-topic">ReturnMe</p>
    </div>

    <main class="auth-container">
        <div class="glass-form-wrapper">
            
            <div class="form-header">
                <h1>Login</h1>
                <p>Sign in with your university email.</p>
            </div>

            <form action="#" class="modern-form" id="loginForm" novalidate>
                
                <div class="form-group">
                    <label for="email">University Email</label>
                    <input type="email" id="email" name="email" placeholder="student@university.edu" autocomplete="email" required aria-describedby="emailHelp">
                    <div id="emailHelp" class="field-note">Use your campus email.</div>
                </div>

                <div class="form-group password-group">
                    <label for="password">Password</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required aria-describedby="passwordHelp">
                        <button type="button" class="toggle-password" aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <div id="passwordHelp" class="field-note">Minimum 8 characters.</div>
                </div>

                <div id="loginFeedback" class="form-alert" role="alert" aria-live="assertive"></div>

                <div class="auth-options">
                    <label class="remember-me" for="remember">
                        <input type="checkbox" id="remember" name="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit btn-found btn-full">
                    Log In
                </button>

                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Create one</a>
                </div>
            </form>

        </div>
    </main>

    <footer class="simple-footer">
        <div class="footer-links">
            <a href="mailto:support@returnme.edu">support@returnme.edu</a>
            <a href="tel:+94716520890">+94 716 520 890</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
        </div>
        <div class="footer-copyright">
            &copy; 2026 ReturnMe. All rights reserved.
        </div>
    </footer>

    <div id="toast-container"></div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
