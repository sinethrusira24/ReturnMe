<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CampusLocator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo"><i class="fa-solid fa-building-columns"></i> CampusLocator</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Search Items</a></li>
                <li><a href="report-lost.html">Report Lost</a></li>
                <li><a href="report-found.html">Report Found</a></li>
            </ul>
            <div class="nav-profile">
                <a href="login.html" class="btn-outline" style="color: var(--danger-color); border-color: var(--danger-color);">Logout</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <div style="display: flex; gap: 2rem;">
            <aside class="card-bg" style="flex: 1; padding: 2rem; border-radius: var(--radius); align-self: flex-start; text-align: center;">
                <div style="width: 100px; height: 100px; background: var(--primary-color); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 1rem;">
                    <i class="fa-regular fa-user"></i>
                </div>
                <h3>John Doe</h3>
                <p style="color: var(--text-light);">Student</p>
                <p style="color: var(--text-light); font-size: 0.9rem;">student@campus.edu</p>
            </aside>

            <div style="flex: 3;">
                <div class="card-bg" style="padding: 2rem; border-radius: var(--radius); margin-bottom: 2rem;">
                    <h3>My Active Claims</h3>
                    <hr style="border: 0; border-top: 1px solid #eee; margin: 1rem 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--background-color); border-radius: var(--radius);">
                        <div>
                            <strong>iPhone 13 - Black Case</strong>
                            <p style="font-size: 0.85rem; color: var(--text-light);">Submitted: Oct 24, 2026</p>
                        </div>
                        <span style="color: #856404; background-color: #fff3cd; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem; font-weight: bold;">Pending Review</span>
                    </div>
                </div>

                <div class="card-bg" style="padding: 2rem; border-radius: var(--radius);">
                    <h3>Items I've Reported</h3>
                    <hr style="border: 0; border-top: 1px solid #eee; margin: 1rem 0;">
                    <p style="color: var(--text-light); text-align: center; padding: 2rem 0;">You haven't reported any lost or found items yet.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
