<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Campus Lost & Found</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="nav-logo" style="justify-content: center; margin-bottom: 1rem;">
                    <i class="fa-solid fa-building-columns"></i> CampusLocator
                </a>
                <h2>Create Account</h2>
                <p>Register to report or claim items</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="fullName"><i class="fa-regular fa-user"></i> Full Name</label>
                    <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="regEmail"><i class="fa-regular fa-envelope"></i> Campus Email</label>
                    <input type="email" id="regEmail" class="form-control" placeholder="student@campus.edu" required>
                </div>

                <div class="form-group">
                    <label for="role"><i class="fa-solid fa-id-badge"></i> Role</label>
                    <select id="role" class="form-control" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="student">Student</option>
                        <option value="staff">Staff Member</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="regPassword"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="regPassword" class="form-control" placeholder="Create a secure password" required>
                </div>

                <button type="submit" class="btn-primary btn-block" style="margin-top: 1.5rem;">Register</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Log in here</a></p>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
