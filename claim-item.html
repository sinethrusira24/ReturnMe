<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Item - ReturnMe</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        </nav>

    <main class="container">
        <div class="form-wrapper card-bg" style="max-width: 600px; margin: 0 auto; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow);">
            <div class="section-header">
                <h2><i class="fa-solid fa-shield-halved"></i> Secure Claim Process</h2>
            </div>
            <p style="margin-bottom: 1.5rem; color: var(--text-light);">You are initiating a claim for: <strong>iPhone 13 - Black Case</strong></p>
            
            <form id="claimForm" onsubmit="handleFormSubmit(event, 'Claim submitted! Security will review your proof.')">
                <div class="form-group">
                    <label for="proofDesc">Provide Proof of Ownership Details</label>
                    <textarea id="proofDesc" class="form-control" rows="3" placeholder="e.g., The lock screen wallpaper is a picture of my dog, and the IMEI number is..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="proofFile">Upload Proof (Receipt, Box with Serial Number, ID)</label>
                    <input type="file" id="proofFile" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="contactNo">Contact Number</label>
                    <input type="tel" id="contactNo" class="form-control" placeholder="For campus security to reach you" required>
                </div>

                <button type="submit" class="btn-primary claim-btn" style="width: 100%; margin-top: 1rem;">Submit Claim for Review</button>
            </form>
        </div>
    </main>

    <div id="toast-container"></div>
    <script src="script.js"></script>
</body>
</html>
